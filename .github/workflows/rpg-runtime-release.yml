name: RPG Runtime Release

on:
  workflow_dispatch:
  push:
    tags:
      - "rpg-runtime-f2efc98-r*"

permissions:
  contents: write

concurrency:
  group: rpg-runtime-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-stage1:
    name: Build fixed Ruby sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl build-essential automake libtool zip universal-ctags ruby

      - name: Set up WASI SDK
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output "${{ runner.temp }}/wasi-sdk.tar.gz" \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-30/wasi-sdk-30.0-x86_64-linux.tar.gz
          mkdir "${{ runner.temp }}/wasi-sdk"
          tar -xzf "${{ runner.temp }}/wasi-sdk.tar.gz" \
            -C "${{ runner.temp }}/wasi-sdk" --strip-components=1

      - name: Set up Binaryen
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output "${{ runner.temp }}/binaryen.tar.gz" \
            https://github.com/WebAssembly/binaryen/releases/download/version_126/binaryen-version_126-x86_64-linux.tar.gz
          mkdir "${{ runner.temp }}/binaryen"
          tar -xzf "${{ runner.temp }}/binaryen.tar.gz" \
            -C "${{ runner.temp }}/binaryen" --strip-components=1

      - name: Check out tagged sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Validate release identity and patch sandbox bindings
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin \
            '+refs/heads/retrom/f2efc98:refs/remotes/origin/retrom/f2efc98'
          if [[ "$GITHUB_REF_TYPE" = tag ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^rpg-runtime-f2efc98-r[1-9][0-9]*$ ]]
            test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
            git merge-base --is-ancestor "$GITHUB_SHA" origin/retrom/f2efc98
          else
            [[ "$GITHUB_REF_NAME" =~ ^(retrom|feat|fix|build)/[a-z0-9][a-z0-9/-]*$ ]]
            git merge-base --is-ancestor origin/retrom/f2efc98 "$GITHUB_SHA"
          fi
          git merge-base --is-ancestor \
            f585dc65499122a7abf503ca5d5dc8ef29452d91 "$GITHUB_SHA"
          test -z "$(git rev-list --min-parents=2 \
            f585dc65499122a7abf503ca5d5dc8ef29452d91.."$GITHUB_SHA")"
          test "$(git rev-parse HEAD:mkxp-z)" = f2efc98a344c505a66820e06d6508092719b8dd2
          test "$(git rev-parse HEAD:retroarch)" = 69a4f0ea1e8aaf442ae4858f2e7f2b31a1776576
          git -C mkxp-z apply --check ../.github/rpg-runtime/mkxp-deterministic-bindings.patch
          git -C mkxp-z apply ../.github/rpg-runtime/mkxp-deterministic-bindings.patch
          python3 .github/rpg-runtime/patch-runtime.py --source "$GITHUB_WORKSPACE"
          ! grep -n '/dev/urandom' mkxp-z/libretro/Makefile
          grep -n "printf '%s'.*sha256sum" mkxp-z/libretro/Makefile
          grep -n 'should_render.*sandbox.has_value().*get_movie_from_main_thread' mkxp-z/src/core.cpp

      - name: Build stage 1
        run: |
          set -euo pipefail
          make -C mkxp-z/libretro -j "$(nproc)" \
            PWD="$GITHUB_WORKSPACE/mkxp-z/libretro" \
            WASI_SDK="${{ runner.temp }}/wasi-sdk" \
            WASM_OPT="${{ runner.temp }}/binaryen/bin/wasm-opt"

      - name: Upload stage 1
        uses: actions/upload-artifact@v7
        with:
          name: rpg-runtime-mkxp-stage1
          path: mkxp-z/libretro/build/libretro-stage1
          retention-days: 1

  build-core:
    needs: build-stage1
    name: Build mkxp-z core
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y meson cmake

      - name: Set up Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.8

      - name: Check out tagged sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply deterministic sandbox binding patch
        run: |
          set -euo pipefail
          git -C mkxp-z apply --check ../.github/rpg-runtime/mkxp-deterministic-bindings.patch
          git -C mkxp-z apply ../.github/rpg-runtime/mkxp-deterministic-bindings.patch
          python3 .github/rpg-runtime/patch-runtime.py --source "$GITHUB_WORKSPACE"

      - name: Download stage 1
        uses: actions/download-artifact@v8
        with:
          name: rpg-runtime-mkxp-stage1
          path: mkxp-z/libretro/build/libretro-stage1

      - name: Configure core
        run: |
          set -euo pipefail
          cat > "${{ runner.temp }}/cross.ini" <<EOF
          [binaries]
          c = 'emcc'
          cpp = 'em++'
          ar = 'emar'
          cmake = 'cmake'
          [host_machine]
          system = 'emscripten'
          cpu_family = 'wasm32'
          cpu = 'wasm32'
          endian = 'little'
          [properties]
          cmake_toolchain_file = '$(em-config EMSCRIPTEN_ROOT)/cmake/Modules/Platform/Emscripten.cmake'
          EOF
          meson setup mkxp-z/build mkxp-z \
            --cross-file "${{ runner.temp }}/cross.ini" \
            --buildtype release \
            -Db_lto=true \
            -Dlibretro=true \
            -Dlibretro_save_states=true \
            -Demscripten_threaded=true

      - name: Build core
        run: ninja -C mkxp-z/build -v

      - name: Upload core
        uses: actions/upload-artifact@v7
        with:
          name: rpg-runtime-mkxp-core
          path: mkxp-z/build/mkxp-z_libretro.a
          retention-days: 1

  release:
    needs: build-core
    name: Build frontend and create release
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Set up Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.8

      - name: Check out tagged sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Download core
        uses: actions/download-artifact@v8
        with:
          name: rpg-runtime-mkxp-core
          path: mkxp-z/build

      - name: Build frontend
        run: |
          set -euo pipefail
          python3 .github/rpg-runtime/patch-remote-content.py \
            --source "$GITHUB_WORKSPACE" \
            --emscripten-root "$(em-config EMSCRIPTEN_ROOT)"
          mv mkxp-z/build/mkxp-z_libretro.a retroarch/libretro_emscripten.a
          emmake make -C retroarch -f Makefile.emscripten \
            LIBRETRO=mkxp-z \
            HAVE_THREADS=1 \
            PROXY_TO_PTHREAD=1 \
            HAVE_AUDIOWORKLET=1 \
            HAVE_RWEBAUDIO=0 \
            HAVE_AL=0 \
            HAVE_WASMFS=1 \
            HAVE_EXTRA_WASMFS=1
          mkdir -p "${{ runner.temp }}/rpg-runtime-output"
          install -m 0644 retroarch/mkxp-z_libretro.js \
            "${{ runner.temp }}/rpg-runtime-output/mkxp-z_libretro.js"
          install -m 0644 retroarch/mkxp-z_libretro.wasm \
            "${{ runner.temp }}/rpg-runtime-output/mkxp-z_libretro.wasm"

      - name: Validate and describe assets
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          python3 .github/rpg-runtime/verify-release.py \
            --source "$GITHUB_WORKSPACE" \
            --output "${{ runner.temp }}/rpg-runtime-output" \
            --repository "https://github.com/$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA"

      - name: Upload integration candidate
        uses: actions/upload-artifact@v7
        with:
          name: rpg-runtime-mkxp-${{ github.sha }}
          path: |
            ${{ runner.temp }}/rpg-runtime-output/mkxp-z_libretro.js
            ${{ runner.temp }}/rpg-runtime-output/mkxp-z_libretro.wasm
          retention-days: 7

      - name: Create immutable-tag release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --title "RPG Runtime mkxp-z Web $GITHUB_REF_NAME" \
            --generate-notes \
            "${{ runner.temp }}/rpg-runtime-output/mkxp-z_libretro.js" \
            "${{ runner.temp }}/rpg-runtime-output/mkxp-z_libretro.wasm" \
            "${{ runner.temp }}/rpg-runtime-output/rpg-runtime-release.json"
